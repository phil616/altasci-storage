services:
  backend:
    image: altasci-storage-backend:${VERSION:-local}
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-data:/var/lib/altasci
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  backend-data:
