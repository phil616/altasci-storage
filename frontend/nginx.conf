server {
    listen 443 ssl http2;
    server_name web.example.com;
    root /usr/share/nginx/html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://web-api.example.com https:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # HTML must never pin references to an older build.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Hashed build artifacts are immutable. Never serve index.html for a
    # missing JavaScript chunk, because browsers reject HTML as a module.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
